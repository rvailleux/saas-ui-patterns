name: Pattern PR — validate & open vote

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch naming
        id: branch-check
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ "$BRANCH" == pattern/* ]]; then
            echo "valid=true" >> $GITHUB_OUTPUT
            SLUG="${BRANCH#pattern/}"
            echo "slug=$SLUG" >> $GITHUB_OUTPUT
          else
            echo "valid=false" >> $GITHUB_OUTPUT
          fi

      - name: Close PR if branch name is wrong
        if: steps.branch-check.outputs.valid == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ❌ Invalid branch name

Pattern PRs must use the branch naming convention:
\`\`\`
pattern/{slug}
\`\`\`
For example: \`pattern/sticky-column-header\`

Please close this PR, rename your branch, and reopen. See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) for details.`
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed'
            });

      - name: Validate required files
        if: steps.branch-check.outputs.valid == 'true'
        id: file-check
        run: |
          SLUG="${{ steps.branch-check.outputs.slug }}"
          MISSING=""

          # Check if this is a batch PR (slug starts with "batch-")
          if [[ "$SLUG" == batch-* ]]; then
            # Batch PR: validate all pattern files changed in the PR
            echo "is_batch=true" >> $GITHUB_OUTPUT
            # Get list of added/modified pattern files
            PATTERNS=$(git diff --name-only origin/main...HEAD | grep -E '^src/_data/patterns/.*\.json$' | sed 's|src/_data/patterns/||' | sed 's|\.json$||' | tr '\n' ' ')
            for PATTERN_SLUG in $PATTERNS; do
              [ ! -f "src/_data/patterns/${PATTERN_SLUG}.json" ] && MISSING="${MISSING}\\n- src/_data/patterns/${PATTERN_SLUG}.json"
              [ ! -f "src/_data/demos/${PATTERN_SLUG}.html" ]    && MISSING="${MISSING}\\n- src/_data/demos/${PATTERN_SLUG}.html"
              [ ! -f "src/_data/demos/${PATTERN_SLUG}.json" ]    && MISSING="${MISSING}\\n- src/_data/demos/${PATTERN_SLUG}.json"
            done
            echo "patterns=$PATTERNS" >> $GITHUB_OUTPUT
          else
            # Single pattern PR: validate single slug
            echo "is_batch=false" >> $GITHUB_OUTPUT
            [ ! -f "src/_data/patterns/${SLUG}.json" ] && MISSING="${MISSING}\\n- src/_data/patterns/${SLUG}.json"
            [ ! -f "src/_data/demos/${SLUG}.html" ]    && MISSING="${MISSING}\\n- src/_data/demos/${SLUG}.html"
            [ ! -f "src/_data/demos/${SLUG}.json" ]    && MISSING="${MISSING}\\n- src/_data/demos/${SLUG}.json"
            echo "patterns=$SLUG" >> $GITHUB_OUTPUT
          fi

          echo "missing=$MISSING" >> $GITHUB_OUTPUT
          if [ -z "$MISSING" ]; then
            echo "files_ok=true" >> $GITHUB_OUTPUT
          else
            echo "files_ok=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment missing files
        if: steps.branch-check.outputs.valid == 'true' && steps.file-check.outputs.files_ok == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const missing = `${{ steps.file-check.outputs.missing }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ⚠️ Missing required files

This PR is missing the following required files:
${missing}

See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md#2-create-the-three-pattern-files) for the exact format and templates. Please push the missing files to this branch.`
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['incomplete']
            });

      - name: Label and open vote period
        if: steps.branch-check.outputs.valid == 'true' && steps.file-check.outputs.files_ok == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const isBatch = '${{ steps.file-check.outputs.is_batch }}' === 'true';
            const patterns = '${{ steps.file-check.outputs.patterns }}'.split(' ').filter(p => p);
            const now = new Date();
            const deadline = new Date(now.getTime() + 15 * 24 * 60 * 60 * 1000);
            const deadlineStr = deadline.toISOString().split('T')[0];

            // Add label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['vote-open']
            });

            let body;
            if (isBatch) {
              const patternList = patterns.map(p => `- \\`${p}\\``).join('\\n');
              body = `## 🗳️ Vote open — Batch PR (${patterns.length} patterns)

All required files are present. The **15-day community vote period** is now open.

**Patterns in this batch:**
${patternList}

| | |
|---|---|
| **Vote deadline** | ${deadlineStr} |
| **Decision** | After ${deadlineStr}, the repository owner will merge, request changes, or close |

**How to vote:**
- 👍 on this PR = in favour of all patterns
- 👎 on this PR = against (please comment which pattern and why)
- Leave a comment with specific feedback, missing examples, or implementation notes

Votes are advisory — the final decision rests with the maintainer.

> This is an automated message. See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md#review-process) for the full process.`;
            } else {
              const slug = patterns[0];
              body = `## 🗳️ Vote open — pattern \\`${slug}\\`

All required files are present. The **15-day community vote period** is now open.

| | |
|---|---|
| **Vote deadline** | ${deadlineStr} |
| **Decision** | After ${deadlineStr}, the repository owner will merge, request changes, or close |

**How to vote:**
- 👍 on this PR = in favour
- 👎 on this PR = against
- Leave a comment with specific feedback, missing examples, or implementation notes

Votes are advisory — the final decision rests with the maintainer.

> This is an automated message. See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md#review-process) for the full process.`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });


