<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
      font-size: 13px;
      display: flex;
      perspective: 1000px;
    }
    /* Background layer */
    .layer-background {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(ellipse at center, #252542 0%, #0f0f1a 70%);
      opacity: 0.5;
      z-index: 1;
    }
    .context-panel {
      position: absolute;
      left: 20px;
      top: 20px;
      bottom: 20px;
      width: 200px;
      background: rgba(26, 26, 46, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 16px;
      z-index: 2;
      border: 1px solid rgba(255,255,255,0.05);
    }
    /* Mid-ground layer */
    .layer-mid {
      position: absolute;
      left: 240px;
      top: 20px;
      right: 20px;
      bottom: 80px;
      background: #1a1a2e;
      border-radius: 16px;
      z-index: 10;
      border: 1px solid #2a2a55;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    /* Foreground layer */
    .toolbar {
      position: absolute;
      left: 260px;
      top: 40px;
      display: flex;
      gap: 8px;
      z-index: 20;
      background: #252542;
      padding: 8px;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    .tool-btn {
      width: 36px;
      height: 36px;
      background: #1a1a2e;
      border: none;
      border-radius: 6px;
      color: #e2e8f0;
      cursor: pointer;
      font-size: 16px;
    }
    .tool-btn:hover { background: #3b82f6; }
    .modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #1e1e3a;
      border: 1px solid #3b82f6;
      border-radius: 16px;
      padding: 24px;
      width: 320px;
      z-index: 100;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(59,130,246,0.3);
    }
    .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
    .modal-text { color: #94a3b8; margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 12px; }
    .btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-secondary { background: #2a2a55; color: #e2e8f0; }
    .layer-label {
      position: absolute;
      font-size: 10px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .label-bg { left: 20px; top: 10px; }
    .label-mid { left: 260px; top: 100px; }
    .label-fg { left: 50%; top: 30%; transform: translateX(-50%); }
    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 200;
    }
  </style>
</head>
<body>
  <div class="layer-background"></div>
  <div class="layer-label label-bg">Background (z-index: 1)</div>

  <div class="context-panel">
    <div style="font-size: 12px; color: #94a3b8; margin-bottom: 12px;">History</div>
    <div style="font-size: 11px; color: #64748b;">Previous versions...</div>
  </div>

  <div class="layer-mid">
    <div class="layer-label label-mid">Mid-ground (z-index: 10)</div>
    <div style="margin-top: 40px; color: #64748b;">Main workspace content area...</div>
  </div>

  <div class="toolbar">
    <button class="tool-btn">✎</button>
    <button class="tool-btn">▭</button>
    <button class="tool-btn">◯</button>
    <button class="tool-btn">🎨</button>
  </div>

  <div class="modal">
    <div class="modal-title">Foreground Modal</div>
    <div class="modal-text">This modal sits at z-index: 100, above all other layers.</div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Close</button>
      <button class="btn btn-primary">Confirm</button>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" onclick="toggleModal()">Toggle Foreground</button>
  </div>

  <script>
    function toggleModal() {
      const modal = document.querySelector('.modal');
      modal.style.display = modal.style.display === 'none' ? 'block' : 'none';
    }
    function closeModal() {
      document.querySelector('.modal').style.display = 'none';
    }
  </script>
</body>
</html>
