<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    .app {
      flex: 1;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .browser-mockup {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .browser-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }
    .browser-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot-red { background: #ef4444; }
    .dot-yellow { background: #f59e0b; }
    .dot-green { background: #22c55e; }
    .browser-address {
      flex: 1;
      background: #0f0f1a;
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 11px;
      color: #64748b;
      text-align: left;
    }
    .status-indicator {
      padding: 40px;
      background: #151528;
      border-radius: 8px;
    }
    .status-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .status-text {
      font-size: 14px;
      color: #94a3b8;
    }
    .notification-preview {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 300px;
      background: #1e3a5f;
      border: 1px solid #3b82f6;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      display: none;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .notification-title { font-weight: 600; margin-bottom: 4px; }
    .notification-body { font-size: 12px; color: #94a3b8; }
    .controls {
      display: flex;
      gap: 12px;
      padding-top: 16px;
      justify-content: center;
    }
    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-secondary { background: #2a2a55; color: #e2e8f0; }
  </style>
</head>
<body>
  <div class="app">
    <div class="browser-mockup">
      <div class="browser-bar">
        <div class="browser-dot dot-red"></div>
        <div class="browser-dot dot-yellow"></div>
        <div class="browser-dot dot-green"></div>
        <div class="browser-address">app.example.com/analysis</div>
      </div>
      <div class="status-indicator">
        <div class="status-icon">⏳</div>
        <div class="status-text">Analysis running in background...</div>
      </div>
    </div>
    <p style="color: #64748b; font-size: 12px;">Switch to another tab to see system notification when complete</p>
  </div>

  <div class="notification-preview" id="notification">
    <div class="notification-title">Analysis Complete</div>
    <div class="notification-body">Your Q4 report analysis is ready to review</div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" onclick="simulateNotification()">Simulate Notification</button>
    <button class="btn btn-secondary" onclick="requestPermission()">Request Permission</button>
  </div>

  <script>
    function simulateNotification() {
      const notif = document.getElementById('notification');
      notif.style.display = 'block';
      setTimeout(() => notif.style.display = 'none', 3000);
    }
    function requestPermission() {
      alert('Requesting browser notification permission...');
    }
  </script>
</body>
</html>
