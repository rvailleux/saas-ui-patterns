<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    .login-form {
      flex: 1;
      max-width: 360px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .form-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      text-align: center;
    }
    .form-subtitle {
      color: #64748b;
      text-align: center;
      margin-bottom: 32px;
    }
    .field {
      margin-bottom: 20px;
    }
    .field-label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .password-wrapper {
      position: relative;
    }
    .field-input {
      width: 100%;
      padding: 12px 44px 12px 14px;
      background: #1a1a2e;
      border: 1px solid #2a2a55;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 14px;
    }
    .field-input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .toggle-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #64748b;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .toggle-btn:hover {
      background: #252542;
      color: #e2e8f0;
    }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #3b82f6;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 12px;
    }
    .hint {
      text-align: center;
      margin-top: 16px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="login-form">
    <div class="form-title">Welcome back</div>
    <div class="form-subtitle">Sign in to your account</div>

    <div class="field">
      <label class="field-label">Email</label>
      <input type="email" class="field-input" placeholder="you@example.com">
    </div>

    <div class="field">
      <label class="field-label">Password</label>
      <div class="password-wrapper">
        <input type="password" class="field-input" id="password" placeholder="••••••••">
        <button type="button" class="toggle-btn" id="toggleBtn" onclick="togglePassword()" aria-label="Show password">
          👁️
        </button>
      </div>
    </div>

    <button class="submit-btn">Sign In</button>

    <div class="hint">Click the eye icon to show/hide password</div>
  </div>

  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleBtn = document.getElementById('toggleBtn');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleBtn.textContent = '🙈';
        toggleBtn.setAttribute('aria-label', 'Hide password');
      } else {
        passwordInput.type = 'password';
        toggleBtn.textContent = '👁️';
        toggleBtn.setAttribute('aria-label', 'Show password');
      }
    }
  </script>
</body>
</html>
