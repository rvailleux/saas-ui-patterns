<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    .table-container {
      flex: 1;
      max-width: 700px;
      margin: 0 auto;
      width: 100%;
      background: #1a1a2e;
      border-radius: 12px;
      overflow: hidden;
    }
    .table-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: #151528;
      border-bottom: 1px solid #2a2a55;
    }
    .select-all {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .data-table {
      width: 100%;
    }
    .data-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid #252542;
    }
    .data-row:hover {
      background: #252542;
    }
    .data-row.selected {
      background: #1e3a5f;
    }
    .row-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .row-content {
      flex: 1;
      display: flex;
      justify-content: space-between;
    }
    .row-title { font-weight: 500; }
    .row-meta { color: #64748b; font-size: 12px; }
    .action-bar {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      background: #3b82f6;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(59, 130, 246, 0.4);
      display: none;
    }
    .action-bar.active {
      display: flex;
    }
    .selection-count {
      font-weight: 600;
    }
    .action-btn {
      padding: 6px 12px;
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 12px;
      cursor: pointer;
    }
    .action-btn.danger {
      background: #ef4444;
    }
    .controls {
      display: flex;
      gap: 12px;
      padding-top: 16px;
      justify-content: center;
    }
    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      cursor: pointer;
      background: #3b82f6;
      color: white;
    }
  </style>
</head>
<body>
  <div class="table-container">
    <div class="table-header">
      <input type="checkbox" class="select-all" id="selectAll" onchange="toggleAll()">
      <span>Select all</span>
    </div>
    <div class="data-table" id="dataTable">
      <div class="data-row" data-id="1">
        <input type="checkbox" class="row-checkbox" onchange="updateSelection()">
        <div class="row-content">
          <span class="row-title">Invoice #1024</span>
          <span class="row-meta">$1,250.00</span>
        </div>
      </div>
      <div class="data-row" data-id="2">
        <input type="checkbox" class="row-checkbox" onchange="updateSelection()">
        <div class="row-content">
          <span class="row-title">Invoice #1025</span>
          <span class="row-meta">$890.00</span>
        </div>
      </div>
      <div class="data-row" data-id="3">
        <input type="checkbox" class="row-checkbox" onchange="updateSelection()">
        <div class="row-content">
          <span class="row-title">Invoice #1026</span>
          <span class="row-meta">$2,100.00</span>
        </div>
      </div>
      <div class="data-row" data-id="4">
        <input type="checkbox" class="row-checkbox" onchange="updateSelection()">
        <div class="row-content">
          <span class="row-title">Invoice #1027</span>
          <span class="row-meta">$450.00</span>
        </div>
      </div>
    </div>
  </div>

  <div class="action-bar" id="actionBar">
    <span class="selection-count" id="selectionCount">0 selected</span>
    <button class="action-btn" onclick="bulkExport()">Export</button>
    <button class="action-btn" onclick="bulkArchive()">Archive</button>
    <button class="action-btn danger" onclick="bulkDelete()">Delete</button>
  </div>

  <div class="controls">
    <button class="btn" onclick="resetSelection()">Reset</button>
  </div>

  <script>
    function updateSelection() {
      const checkboxes = document.querySelectorAll('.row-checkbox');
      const rows = document.querySelectorAll('.data-row');
      let count = 0;

      checkboxes.forEach((cb, i) => {
        rows[i].classList.toggle('selected', cb.checked);
        if (cb.checked) count++;
      });

      document.getElementById('selectionCount').textContent = count + ' selected';
      document.getElementById('actionBar').classList.toggle('active', count > 0);
    }

    function toggleAll() {
      const allChecked = document.getElementById('selectAll').checked;
      document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = allChecked);
      updateSelection();
    }

    function bulkExport() {
      alert('Exporting selected items...');
    }

    function bulkArchive() {
      alert('Archiving selected items...');
    }

    function bulkDelete() {
      if (confirm('Delete selected items?')) {
        alert('Items deleted');
      }
    }

    function resetSelection() {
      document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
      updateSelection();
    }
  </script>
</body>
</html>
