<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    .demo-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }
    .demo-card {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 20px;
    }
    .demo-title {
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: #151528;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .item:hover {
      background: #252542;
      transform: translateX(4px);
    }
    .item-icon {
      width: 32px;
      height: 32px;
      background: #3b82f6;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .item-text { flex: 1; }
    .toast-container {
      position: fixed;
      bottom: 80px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      background: #1e3a5f;
      border: 1px solid #3b82f6;
      border-radius: 8px;
      padding: 12px 16px;
      animation: slideInRight 0.3s ease;
    }
    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      padding-top: 16px;
    }
    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      cursor: pointer;
      background: #3b82f6;
      color: white;
    }
  </style>
</head>
<body>
  <div class="demo-area">
    <div class="demo-card">
      <div class="demo-title">Origin Hint: Hover to see where focus moves</div>
      <div class="item-list">
        <div class="item" onclick="showToast('Item 1 clicked')">
          <div class="item-icon">📄</div>
          <div class="item-text">Document.pdf</div>
        </div>
        <div class="item" onclick="showToast('Item 2 clicked')">
          <div class="item-icon">📊</div>
          <div class="item-text">Report.xlsx</div>
        </div>
        <div class="item" onclick="showToast('Item 3 clicked')">
          <div class="item-icon">🖼️</div>
          <div class="item-text">Image.png</div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <div class="controls">
    <button class="btn" onclick="addItem()">Add Item (Origin)</button>
    <button class="btn" onclick="showStateChange()">State Change</button>
  </div>

  <script>
    function showToast(message) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 2000);
    }
    function addItem() {
      showToast('New item added with origin animation');
    }
    function showStateChange() {
      showToast('State changed with transition');
    }
  </script>
</body>
</html>
