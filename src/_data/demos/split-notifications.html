<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    .phone-mockup {
      flex: 1;
      max-width: 360px;
      margin: 0 auto;
      width: 100%;
      background: #1a1a2e;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      border: 4px solid #2a2a55;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      padding: 12px 20px;
      background: #0f0f1a;
    }
    .panel-tabs {
      display: flex;
      background: #151528;
      border-bottom: 1px solid #2a2a55;
    }
    .panel-tab {
      flex: 1;
      padding: 14px;
      text-align: center;
      font-size: 12px;
      cursor: pointer;
      color: #64748b;
    }
    .panel-tab.active {
      color: #3b82f6;
      border-bottom: 2px solid #3b82f6;
    }
    .panel-content {
      padding: 16px;
      height: calc(100% - 100px);
      overflow-y: auto;
    }
    .notification-item {
      display: flex;
      gap: 12px;
      padding: 12px;
      background: #252542;
      border-radius: 12px;
      margin-bottom: 10px;
    }
    .notif-icon {
      width: 40px;
      height: 40px;
      background: #3b82f6;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .notif-content { flex: 1; }
    .notif-title { font-weight: 500; font-size: 13px; }
    .notif-text { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    .notif-time { font-size: 11px; color: #64748b; }
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .quick-tile {
      aspect-ratio: 1;
      background: #252542;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }
    .quick-tile.active {
      background: #3b82f6;
    }
    .quick-icon { font-size: 24px; }
    .quick-label { font-size: 11px; }
    .hidden { display: none !important; }
    .controls {
      display: flex;
      gap: 12px;
      padding-top: 16px;
      justify-content: center;
    }
    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      cursor: pointer;
      background: #3b82f6;
      color: white;
    }
  </style>
</head>
<body>
  <div class="phone-mockup">
    <div class="status-bar">
      <span>9:41</span>
      <span>📶 🔋</span>
    </div>
    <div class="panel-tabs">
      <div class="panel-tab active" onclick="switchPanel('notifications')">Notifications</div>
      <div class="panel-tab" onclick="switchPanel('quicksettings')">Quick Settings</div>
    </div>
    <div class="panel-content" id="panelContent">
      <div id="notificationsPanel">
        <div class="notification-item">
          <div class="notif-icon">💬</div>
          <div class="notif-content">
            <div class="notif-title">New Message</div>
            <div class="notif-text">Hey, can we meet tomorrow?</div>
          </div>
          <div class="notif-time">2m</div>
        </div>
        <div class="notification-item">
          <div class="notif-icon">📧</div>
          <div class="notif-content">
            <div class="notif-title">Email</div>
            <div class="notif-text">Your weekly summary is ready</div>
          </div>
          <div class="notif-time">1h</div>
        </div>
      </div>
      <div id="quicksettingsPanel" class="hidden">
        <div class="quick-grid">
          <div class="quick-tile active">
            <div class="quick-icon">📶</div>
            <div class="quick-label">Wi-Fi</div>
          </div>
          <div class="quick-tile">
            <div class="quick-icon">🔵</div>
            <div class="quick-label">Bluetooth</div>
          </div>
          <div class="quick-tile active">
            <div class="quick-icon">✈️</div>
            <div class="quick-label">Airplane</div>
          </div>
          <div class="quick-tile">
            <div class="quick-icon">🔦</div>
            <div class="quick-label">Flashlight</div>
          </div>
          <div class="quick-tile active">
            <div class="quick-icon">🔄</div>
            <div class="quick-label">Rotate</div>
          </div>
          <div class="quick-tile">
            <div class="quick-icon">📍</div>
            <div class="quick-label">Location</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" onclick="addNotification()">Add Notification</button>
  </div>

  <script>
    function switchPanel(panel) {
      document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');

      document.getElementById('notificationsPanel').classList.toggle('hidden', panel !== 'notifications');
      document.getElementById('quicksettingsPanel').classList.toggle('hidden', panel !== 'quicksettings');
    }
    function addNotification() {
      alert('New notification added!');
    }
  </script>
</body>
</html>
