<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    .inbox {
      flex: 1;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }
    .inbox-header {
      padding: 16px 0;
      border-bottom: 1px solid #2a2a55;
      margin-bottom: 16px;
    }
    .inbox-title { font-size: 18px; font-weight: 600; }
    .smart-nudge {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #1e3a5f;
      border-left: 4px solid #3b82f6;
      border-radius: 8px;
      margin-bottom: 16px;
      animation: slideIn 0.5s ease;
    }
    @keyframes slideIn {
      from { transform: translateX(-20px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .nudge-icon { font-size: 20px; }
    .nudge-content { flex: 1; }
    .nudge-text { font-size: 13px; }
    .nudge-reason { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .nudge-actions { display: flex; gap: 8px; }
    .btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-text { background: transparent; color: #94a3b8; }
    .email-list { display: flex; flex-direction: column; gap: 8px; }
    .email-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: #1a1a2e;
      border-radius: 8px;
    }
    .email-sender {
      width: 36px;
      height: 36px;
      background: #3b82f6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }
    .email-content { flex: 1; }
    .email-from { font-weight: 500; }
    .email-subject { color: #94a3b8; font-size: 12px; }
    .email-time { font-size: 11px; color: #64748b; }
    .controls {
      display: flex;
      gap: 12px;
      padding-top: 16px;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="inbox">
    <div class="inbox-header">
      <div class="inbox-title">Smart Inbox</div>
    </div>
    <div class="smart-nudge" id="nudge">
      <div class="nudge-icon">💡</div>
      <div class="nudge-content">
        <div class="nudge-text">You haven't replied to this important email</div>
        <div class="nudge-reason">Usually responded within 2 hours • 5 days ago</div>
      </div>
      <div class="nudge-actions">
        <button class="btn btn-primary" onclick="replyNow()">Reply</button>
        <button class="btn btn-text" onclick="dismissNudge()">Dismiss</button>
      </div>
    </div>
    <div class="email-list">
      <div class="email-item">
        <div class="email-sender">JD</div>
        <div class="email-content">
          <div class="email-from">John Doe</div>
          <div class="email-subject">Q4 Review Meeting - Action Required</div>
        </div>
        <div class="email-time">5 days ago</div>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="btn btn-primary" onclick="showNudge()">Show Smart Nudge</button>
  </div>
  <script>
    function dismissNudge() {
      document.getElementById('nudge').style.display = 'none';
    }
    function showNudge() {
      document.getElementById('nudge').style.display = 'flex';
    }
    function replyNow() {
      alert('Opening reply composer...');
    }
  </script>
</body>
</html>
