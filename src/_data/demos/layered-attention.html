<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-size: 13px;
    }
    .app { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 16px; }
    .tier-demo { background: #1a1a2e; border-radius: 12px; padding: 20px; }
    .tier-demo h3 { margin-bottom: 16px; color: #94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .status-row { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
    .status-row:last-child { margin-bottom: 0; }
    .tier-label { width: 100px; font-size: 12px; color: #64748b; }
    /* Ambient Tier */
    .ambient-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: #252542;
      border-radius: 20px;
      font-size: 12px;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #3b82f6;
    }
    .pulse-dot.active { animation: pulse 2s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    /* Progress Tier */
    .progress-indicator {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: #1e3a5f;
      border: 1px solid #3b82f6;
      border-radius: 10px;
      min-width: 280px;
    }
    .mini-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #3b82f6;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress-info { flex: 1; }
    .progress-title { font-size: 12px; margin-bottom: 4px; }
    .progress-bar {
      height: 4px;
      background: #2a2a55;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #3b82f6;
      border-radius: 2px;
      transition: width 0.3s ease;
    }
    .progress-meta { font-size: 11px; color: #64748b; }
    /* Attention Tier */
    .attention-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: #fef3c7;
      border: 2px solid #f59e0b;
      border-radius: 12px;
      color: #92400e;
      max-width: 400px;
      animation: attentionPulse 2s infinite;
    }
    @keyframes attentionPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
      50% { box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); }
    }
    .attention-icon { font-size: 20px; }
    .attention-content { flex: 1; }
    .attention-title { font-weight: 600; margin-bottom: 2px; }
    .attention-text { font-size: 12px; opacity: 0.8; }
    .attention-actions { display: flex; gap: 8px; }
    .btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-primary { background: #f59e0b; color: white; }
    .btn-secondary { background: rgba(0,0,0,0.1); color: #92400e; }
    /* Summary Tier */
    .summary-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: #1e3a5f;
      border-left: 4px solid #22c55e;
      border-radius: 8px;
    }
    .summary-icon {
      width: 24px;
      height: 24px;
      background: #22c55e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .summary-content { flex: 1; }
    .summary-title { font-weight: 500; }
    .summary-meta { font-size: 11px; color: #94a3b8; }
    .btn-text { background: none; border: none; color: #3b82f6; cursor: pointer; font-size: 12px; }
    /* Controls */
    .controls {
      display: flex;
      gap: 12px;
      padding: 16px 20px;
      background: #151528;
      border-top: 1px solid #2a2a45;
    }
    .tier-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #2a2a55;
      background: #1a1a2e;
      color: #94a3b8;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .tier-btn:hover { border-color: #3b82f6; color: #fff; }
    .tier-btn.active { background: #3b82f6; border-color: #3b82f6; color: white; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <div class="tier-demo">
      <h3>Four-Tier Attention System</h3>

      <div class="status-row">
        <span class="tier-label">1. Ambient</span>
        <div class="ambient-indicator" id="ambientTier">
          <div class="pulse-dot" id="ambientDot"></div>
          <span>AI running</span>
        </div>
      </div>

      <div class="status-row">
        <span class="tier-label">2. Progress</span>
        <div class="progress-indicator hidden" id="progressTier">
          <div class="mini-spinner"></div>
          <div class="progress-info">
            <div class="progress-title">Processing data...</div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
          </div>
          <span class="progress-meta" id="progressPercent">0%</span>
        </div>
      </div>

      <div class="status-row">
        <span class="tier-label">3. Attention</span>
        <div class="attention-card hidden" id="attentionTier">
          <span class="attention-icon">⚠️</span>
          <div class="attention-content">
            <div class="attention-title">Review Required</div>
            <div class="attention-text">Found 3 conflicts needing your input</div>
          </div>
          <div class="attention-actions">
            <button class="btn btn-primary" onclick="resolveAttention()">Review</button>
            <button class="btn btn-secondary" onclick="dismissAttention()">Later</button>
          </div>
        </div>
      </div>

      <div class="status-row">
        <span class="tier-label">4. Summary</span>
        <div class="summary-card hidden" id="summaryTier">
          <span class="summary-icon">✓</span>
          <div class="summary-content">
            <div class="summary-title">Task completed successfully</div>
            <div class="summary-meta">Processed 247 items in 3m 42s</div>
          </div>
          <button class="btn-text" onclick="viewDetails()">View details</button>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="tier-btn" onclick="setTier('ambient')">1. Ambient</button>
    <button class="tier-btn" onclick="setTier('progress')">2. Progress</button>
    <button class="tier-btn" onclick="setTier('attention')">3. Attention</button>
    <button class="tier-btn" onclick="setTier('summary')">4. Summary</button>
    <button class="tier-btn" onclick="simulateFlow()" style="margin-left: auto;">▶ Simulate Flow</button>
  </div>

  <script>
    let currentTier = 'ambient';
    let progressInterval;

    function setTier(tier) {
      currentTier = tier;

      // Update buttons
      document.querySelectorAll('.tier-btn').forEach(btn => btn.classList.remove('active'));
      event?.target?.classList.add('active');

      // Reset all
      clearInterval(progressInterval);
      document.getElementById('ambientDot').classList.remove('active');
      document.getElementById('progressTier').classList.add('hidden');
      document.getElementById('attentionTier').classList.add('hidden');
      document.getElementById('summaryTier').classList.add('hidden');

      // Show appropriate tier
      switch(tier) {
        case 'ambient':
          document.getElementById('ambientDot').classList.add('active');
          break;
        case 'progress':
          document.getElementById('ambientDot').classList.add('active');
          document.getElementById('progressTier').classList.remove('hidden');
          animateProgress();
          break;
        case 'attention':
          document.getElementById('attentionTier').classList.remove('hidden');
          break;
        case 'summary':
          document.getElementById('summaryTier').classList.remove('hidden');
          break;
      }
    }

    function animateProgress() {
      let progress = 0;
      progressInterval = setInterval(() => {
        progress += Math.random() * 5;
        if (progress >= 100) progress = 0;
        document.getElementById('progressFill').style.width = progress + '%';
        document.getElementById('progressPercent').textContent = Math.floor(progress) + '%';
      }, 200);
    }

    function resolveAttention() {
      alert('Opening review interface...');
    }

    function dismissAttention() {
      document.getElementById('attentionTier').classList.add('hidden');
      // Move to ambient with badge
      document.getElementById('ambientDot').classList.add('active');
    }

    function viewDetails() {
      alert('Opening detailed report...');
    }

    async function simulateFlow() {
      const tiers = ['ambient', 'progress', 'attention', 'summary'];
      const buttons = document.querySelectorAll('.tier-btn');

      for (let i = 0; i < tiers.length; i++) {
        buttons[i].click();
        await new Promise(r => setTimeout(r, i === 1 ? 2000 : 1500));
      }
    }

    // Start with ambient
    setTier('ambient');
  </script>
</body>
</html>
