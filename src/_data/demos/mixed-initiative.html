<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    .editor {
      flex: 1;
      background: #1a1a2e;
      border-radius: 12px;
      padding: 20px;
      overflow-y: auto;
      position: relative;
    }
    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #2a2a55;
    }
    .editor-title { font-weight: 500; }
    .collab-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #94a3b8;
    }
    .collab-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .content {
      font-size: 14px;
      line-height: 1.7;
    }
    .paragraph {
      margin-bottom: 12px;
      min-height: 24px;
      position: relative;
    }
    .ai-cursor {
      display: inline-block;
      width: 2px;
      height: 18px;
      background: #3b82f6;
      animation: blink 1s infinite;
      vertical-align: middle;
      margin-left: 2px;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .ghost-text {
      color: #64748b;
      font-style: italic;
    }
    .ai-badge {
      position: absolute;
      right: -80px;
      top: 0;
      padding: 2px 8px;
      background: #3b82f6;
      color: white;
      font-size: 10px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .paragraph:hover .ai-badge { opacity: 1; }
    .controls {
      display: flex;
      gap: 12px;
      padding-top: 16px;
    }
    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-primary {
      background: #3b82f6;
      color: white;
    }
    .btn-secondary {
      background: #2a2a55;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="editor">
    <div class="editor-header">
      <span class="editor-title">Collaborative Document</span>
      <div class="collab-indicator">
        <div class="collab-dot"></div>
        <span>AI Assistant active</span>
      </div>
    </div>
    <div class="content" id="content">
      <div class="paragraph">
        The quick brown fox jumps over the lazy dog.
        <span class="ai-cursor"></span>
      </div>
      <div class="paragraph">
        <span class="ghost-text">AI is suggesting improvements...</span>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="btn btn-primary" onclick="simulateCollaboration()">Simulate Collaboration</button>
    <button class="btn btn-secondary" onclick="toggleGhostText()">Toggle Suggestions</button>
  </div>
  <script>
    function simulateCollaboration() {
      alert('AI and user editing simultaneously...');
    }
    function toggleGhostText() {
      document.querySelector('.ghost-text').style.display =
        document.querySelector('.ghost-text').style.display === 'none' ? 'inline' : 'none';
    }
  </script>
</body>
</html>
